<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090b10" />
  <title>Facial Aesthetics Analyzer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b10;
      --panel: #11141c;
      --panel-soft: #161a24;
      --ink: #f4f7fb;
      --muted: #9aa5b7;
      --line: rgba(255, 255, 255, 0.1);
      --accent: #66f2d5;
      --accent-2: #b7a8ff;
      --danger: #ff8c9a;
      --good: #8dffbf;
      --shadow: 0 28px 90px rgba(0, 0, 0, 0.5);
      --radius: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(102, 242, 213, 0.12), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(183, 168, 255, 0.1), transparent 30rem),
        linear-gradient(135deg, #07080c 0%, #10131b 52%, #080a0f 100%);
      color: var(--ink);
    }

    body {
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }

    .app {
      width: min(100%, 980px);
      display: grid;
      gap: 24px;
    }

    .masthead {
      display: grid;
      gap: 10px;
      text-align: center;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 5vw, 4.6rem);
      font-weight: 800;
      letter-spacing: 0;
      line-height: 0.96;
    }

    .subtitle {
      max-width: 660px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(0.98rem, 2vw, 1.08rem);
      line-height: 1.65;
    }

    .stage {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(17, 20, 28, 0.78);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(18px);
    }

    .camera-wrap {
      position: relative;
      margin: 18px;
      overflow: hidden;
