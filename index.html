<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090b10" />
  <title>Neural Scanner</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      --bg: #080a0f;
      --panel: rgba(17, 20, 29, 0.82);
      --panel-2: rgba(12, 15, 23, 0.9);
      --ink: #f5f7fb;
      --muted: #9aa6b8;
      --line: rgba(255, 255, 255, 0.1);
      --accent: #66f2d5;
      --accent-2: #b8a7ff;
      --hot: #ff8cbd;
      --warn: #ffd166;
      --danger: #ff8c9a;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(102, 242, 213, 0.13), transparent 32rem),
        radial-gradient(circle at bottom right, rgba(255, 140, 189, 0.12), transparent 31rem),
        linear-gradient(135deg, #07080c, #111521 52%, #080a10);
    }

    button, input { font: inherit; }

    .app {
      width: min(1120px, 100%);
      display: grid;
      gap: 22px;
    }

    header {
      display: grid;
      gap: 12px;
      text-align: center;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 7vw, 86px);
      line-height: 0.92;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 720px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.6;
    }

    .shell {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 32px 100px rgba(0, 0, 0, 0.52), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(18px);
    }

    .mode-bar {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.12);
    }

    .mode-btn {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
