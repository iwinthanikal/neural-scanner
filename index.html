<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090b10" />
  <title>Neural Scanner</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      --bg: #080a0f;
      --panel: rgba(17, 20, 29, 0.82);
      --panel-2: rgba(12, 15, 23, 0.9);
      --ink: #f5f7fb;
      --muted: #9aa6b8;
      --line: rgba(255, 255, 255, 0.1);
      --accent: #66f2d5;
      --accent-2: #b8a7ff;
      --hot: #ff8cbd;
      --warn: #ffd166;
      --danger: #ff8c9a;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(102, 242, 213, 0.13), transparent 32rem),
        radial-gradient(circle at bottom right, rgba(255, 140, 189, 0.12), transparent 31rem),
        linear-gradient(135deg, #07080c, #111521 52%, #080a10);
    }

    button, input { font: inherit; }

    .app {
      width: min(1120px, 100%);
      display: grid;
      gap: 22px;
    }

    header {
      display: grid;
      gap: 12px;
      text-align: center;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 7vw, 86px);
      line-height: 0.92;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 720px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.6;
    }

    .shell {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 32px 100px rgba(0, 0, 0, 0.52), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(18px);
    }

    .mode-bar {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.12);
    }

    .mode-btn {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
        showCameraError("Camera access is not supported by this browser. You can still use demo mode.");
        return;
      }

      try {
        statusText.textContent = "Awaiting camera permission...";
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        message.classList.add("hidden");
        analyzeButton.disabled = false;
        statusText.textContent = "Camera ready.";
      } catch (error) {
        showCameraError("Camera permission was blocked. Allow camera access or use demo mode.");
      }
    }

    function showCameraError(text) {
      message.textContent = text;
      message.classList.remove("hidden");
      analyzeButton.disabled = true;
      statusText.textContent = "Camera unavailable.";
    }

    function setScanning(active, label) {
      scanning = active;
      scan.classList.toggle("active", active);
      analyzeButton.disabled = active || (!stream && !label);
      skipButton.disabled = active;
      statusText.textContent = active ? label : stream ? "Camera ready." : "Camera unavailable.";
    }

    function renderStats(container, stats) {
      container.innerHTML = "";
      Object.entries(stats).forEach(([name, value]) => {
        const stat = document.createElement("div");
        stat.className = "stat";
        stat.innerHTML = '<div class="stat-top"><span>' + name + '</span><span>' + value + '%</span></div><div class="bar"><div class="fill" style="--value:' + value + '%"></div></div>';
        container.appendChild(stat);
      });
    }

    function renderList(container, items) {
      container.innerHTML = "";
      items.forEach((item) => {
        const li = document.createElement("li");
        li.textContent = item;
        container.appendChild(li);
      });
    }

    function renderBadges(profile) {
      badges.innerHTML = "";
      [profile.title, "Top Stat: " + topStat(profile), "Shareable Score"].forEach((text) => {
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = text;
        badges.appendChild(badge);
      });
    }

    function topStat(profile) {
      return Object.entries(profile.stats).sort((a, b) => b[1] - a[1])[0][0];
    }

    function showSolo(profile) {
      resultTitle.textContent = profile.name + "'s Composite Rating";
      mainScore.textContent = profile.rating.toFixed(1);
      renderBadges(profile);
      renderStats(soloStats, profile.stats);
      renderList(soloHighlights, profile.highlights);
      soloCards.classList.remove("hidden");
      compareCards.classList.add("hidden");
      lastShare = "I scored " + profile.rating.toFixed(1) + "/10 on Neural Scanner with " + profile.title + ". Top stat: " + topStat(profile) + ".";
      shareText.textContent = lastShare;
      openResults();
    }

    function showCompare(first, second) {
      const winner = first.rating >= second.rating ? first : second;
      const gap = Math.abs(first.rating - second.rating).toFixed(1);

      resultTitle.textContent = "Friend Battle Winner";
      mainScore.textContent = winner.rating.toFixed(1);
      badges.innerHTML = "";
      ["Winner: " + winner.name, "Gap: " + gap, "Viral Compare Card"].forEach((text) => {
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = text;
        badges.appendChild(badge);
      });

      compareCards.innerHTML = "";
      [first, second].forEach((profile) => {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = '<div class="mini-score"><div><h3>' + profile.name + '</h3><span>' + profile.title + '</span></div><strong>' + profile.rating.toFixed(1) + '</strong></div><div class="stat-list"></div>';
        renderStats(card.querySelector(".stat-list"), profile.stats);
        compareCards.appendChild(card);
      });

      soloCards.classList.add("hidden");
      compareCards.classList.remove("hidden");
      lastShare = first.name + " vs " + second.name + " on Neural Scanner: " + first.rating.toFixed(1) + " vs " + second.rating.toFixed(1) + ". Winner: " + winner.name + " by " + gap + " points.";
      shareText.textContent = lastShare;
      openResults();
    }

    function openResults() {
      cameraPanel.classList.add("hidden");
      results.classList.add("visible");
      copyStatus.textContent = "";
    }

    function runScan(useDemo = false) {
      if (scanning) return;
      if (!stream && !useDemo) return;

      const label = mode === "compare" && pendingCompare.length === 1
        ? "Scanning friend stats..."
        : "Scanning facial landmarks...";

      setScanning(true, label);

      setTimeout(() => {
        setScanning(false);
        if (mode === "solo") {
          showSolo(makeProfile(cleanName(yourName, "You")));
          return;
        }

        if (pendingCompare.length === 0) {
          pendingCompare.push(makeProfile(cleanName(yourName, "You")));
          analyzeButton.textContent = "Scan Friend";
          stepTitle.textContent = "Step 2: scan your friend";
          stepCopy.textContent = "Pass the camera over and hit scan again to reveal the battle card.";
          statusText.textContent = "Your scan saved. Ready for friend scan.";
          return;
        }

        pendingCompare.push(makeProfile(cleanName(friendName, "Friend")));
        showCompare(pendingCompare[0], pendingCompare[1]);
      }, SCAN_MS);
    }

    function reset() {
      pendingCompare = [];
      results.classList.remove("visible");
      cameraPanel.classList.remove("hidden");
      setMode(mode);
      analyzeButton.disabled = !stream;
      statusText.textContent = stream ? "Camera ready." : "Camera unavailable.";
    }

    async function copyResult() {
      try {
        await navigator.clipboard.writeText(lastShare + " " + location.href);
        copyStatus.textContent = "Copied. Post it anywhere.";
      } catch (error) {
        copyStatus.textContent = lastShare;
      }
    }

    soloMode.addEventListener("click", () => setMode("solo"));
    compareMode.addEventListener("click", () => setMode("compare"));
    analyzeButton.addEventListener("click", () => runScan(false));
    skipButton.addEventListener("click", () => runScan(true));
    resetButton.addEventListener("click", reset);
    copyButton.addEventListener("click", copyResult);
    window.addEventListener("beforeunload", () => {
      if (stream) stream.getTracks().forEach((track) => track.stop());
    });

    setMode("solo");
    initCamera();
  </script>
</body>
</html>
